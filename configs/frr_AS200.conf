frr version 8.4_git
frr defaults traditional
hostname AS200
!
router bgp 200
 bgp router-id 2.2.2.2
 neighbor 192.168.100.10 remote-as 100
 neighbor 192.168.100.30 remote-as 300
 no bgp ebgp-requires-policy
!
ip prefix-list BOGONS seq 5 deny 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 deny 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 15 permit 0.0.0.0/0 le 32
